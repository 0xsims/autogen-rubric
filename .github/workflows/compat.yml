name: Framework Compatibility

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest tests/ -v

  frameworks:
    name: ${{ matrix.framework }}
    runs-on: ubuntu-latest
    needs: core
    continue-on-error: true  # one framework failing won't block others
    strategy:
      fail-fast: false
      matrix:
        framework:
          - openai
          - anthropic
          - langchain
          - langgraph
          - llama-index
          - crewai
          - dspy
          - haystack-ai
          - semantic-kernel
          - pydantic-ai-slim
          - openai-agents
          - google-adk
          - strands-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install latest ${{ matrix.framework }}
        run: pip install pytest ${{ matrix.framework }}
      - name: Smoke test with ${{ matrix.framework }} installed
        run: pytest tests/ -v -k "not test_no_frameworks"
        env:
          RUBRIC_CI_KEY: ${{ secrets.RUBRIC_CI_KEY }}

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [core, frameworks]
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          to: Scott@Rubric-Protocol.com
          from: Rubric CI <${{ secrets.GMAIL_USER }}>
          subject: "⚠️ autogen-rubric compat failure — ${{ github.run_id }}"
          body: |
            A framework compatibility check failed in autogen-rubric.

            Workflow: ${{ github.workflow }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Check which framework broke and update the adapter + pyproject.toml version pins.
