name: Framework Compatibility

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest .
      - run: pytest tests/ -v

  frameworks:
    name: ${{ matrix.framework }}
    runs-on: ubuntu-latest
    needs: core
    continue-on-error: true  # one framework failing won't block others
    strategy:
      fail-fast: false
      matrix:
        framework:
          - openai
          - anthropic
          - langchain
          - langgraph
          - llama-index
          - crewai
          - dspy
          - haystack-ai
          - semantic-kernel
          - pydantic-ai-slim
          - openai-agents
          - google-adk
          - strands-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install latest ${{ matrix.framework }}
        run: pip install pytest httpx requests ${{ matrix.framework }} .
      - name: Smoke test with ${{ matrix.framework }} installed
        run: pytest tests/ -v -k "not test_no_frameworks" --ignore=tests/test_live_smoke.py
      - name: Live smoke (own process — test_core mocks poison sys.modules in a shared run)
        run: pytest tests/test_live_smoke.py -v
        env:
          RUBRIC_CI_KEY: ${{ secrets.RUBRIC_CI_KEY }}

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    permissions:
      issues: write
    needs: [core, frameworks]
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - name: Open or update a CI failure issue
        uses: ./.github/actions/notify-failure
